    /* =====================================================================
       خلفية متحركة بطيئة وناعمة (Slow Ambient Drifting Orbs & Grid Shimmer)
       ===================================================================== */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 18%, rgba(79, 70, 229, 0.08), transparent 46%),
        radial-gradient(circle at 86% 16%, rgba(13, 148, 136, 0.08), transparent 46%),
        radial-gradient(circle at 50% 88%, rgba(245, 158, 11, 0.07), transparent 50%),
        linear-gradient(180deg, #f8fafc 0%, #f1f5f9 55%, #f8fafc 100%);
    }

    .ambient-grid {
      position: absolute;
      inset: -20%;
      opacity: 0.5;
      background-image: radial-gradient(rgba(79, 70, 229, 0.11) 1.25px, transparent 1.25px);
      background-size: 30px 30px;
      will-change: transform, opacity;
      animation: gridShimmer 26s ease-in-out infinite alternate;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(68px);
      will-change: transform, opacity;
    }

    .orb-1 {
      width: 440px;
      height: 440px;
      top: -90px;
      right: -70px;
      background: rgba(79, 70, 229, 0.16);
      animation: driftOrbOne 22s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      top: 32%;
      left: -100px;
      background: rgba(13, 148, 136, 0.14);
      animation: driftOrbTwo 27s ease-in-out infinite alternate;
    }

    .orb-3 {
      width: 460px;
      height: 460px;
      bottom: -140px;
      right: 20%;
      background: rgba(245, 158, 11, 0.13);
      animation: driftOrbThree 24s ease-in-out infinite alternate;
    }

    @keyframes driftOrbOne {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.72; }
      50% { transform: translate3d(-44px, 38px, 0) scale(1.06); opacity: 0.92; }
      100% { transform: translate3d(-20px, 72px, 0) scale(0.98); opacity: 0.76; }
    }

    @keyframes driftOrbTwo {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.68; }
      50% { transform: translate3d(52px, -34px, 0) scale(1.07); opacity: 0.88; }
      100% { transform: translate3d(28px, 42px, 0) scale(0.97); opacity: 0.72; }
    }

    @keyframes driftOrbThree {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.65; }
      50% { transform: translate3d(-38px, -44px, 0) scale(1.05); opacity: 0.86; }
      100% { transform: translate3d(34px, -20px, 0) scale(1.01); opacity: 0.72; }
    }

    @keyframes gridShimmer {
      0% { transform: translate3d(0, 0, 0); opacity: 0.38; }
      100% { transform: translate3d(26px, 26px, 0); opacity: 0.58; }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb-1, .orb-2, .orb-3, .ambient-grid {
        animation: none !important;
        transform: none !important;
      }
    }

    .glass-surface {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
    }

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toast = null;
        render();
      }, 3400);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function isValidEgyptianMobile(phone) {
      return /^01[0125][0-9]{8}$/.test((phone || '').trim());
    }

    // =========================================================================

    window.openAuthModal = function (tab = 'register') {
      state.modal = { type: 'auth', tab };

      render();

    window.closeModal = function () {
      state.modal = null;

      render();

    window.switchAuthTab = function (tab) {
      state.modal = { type: 'auth', tab };
      state.authError = '';

    window.handleRegisterSubmit = function (event) {
      event.preventDefault();
      const form = event.target;
      const fullName = form.fullName.value.trim();
      const studentPhone = form.studentPhone.value.trim();
      const parentPhone = form.parentPhone.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value.trim();
      const grade = form.grade.value;

      const words = fullName.split(/\s+/).filter(Boolean);
      if (words.length < 2) {
        state.authError = 'يرجى إدخال الاسم بالكامل (اسمين على الأقل، مثال: أحمد محمد علي).';
        render();
        return;
      }

      if (!isValidEgyptianMobile(studentPhone)) {
        state.authError = 'رقم هاتف الطالب غير صحيح. يجب أن يبدأ بـ 010 أو 011 أو 012 أو 015 ومكون من 11 رقماً.';
        render();
        return;
      }

      if (!isValidEgyptianMobile(parentPhone)) {
        state.authError = 'رقم ولي الأمر غير صحيح. يجب أن يكون رقم موبايل مصري مكون من 11 رقماً.';
        render();
        return;
      }

      if (studentPhone === parentPhone) {
        state.authError = 'يجب أن يختلف رقم هاتف ولي الأمر عن رقم هاتف الطالب.';
        render();
        return;
      }

      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        state.authError = 'صيغة البريد الإلكتروني غير صحيحة (يمكنك تركه فارغاً لأنه اختياري).';
        render();
        return;
      }

      if (password.length < 4) {
        state.authError = 'يرجى إدخال كلمة مرور لا تقل عن 4 أحرف أو أرقام.';
        render();
        return;
      }

      const newUser = {
        fullName,
        studentPhone,
        parentPhone,
        email,
        password,
        grade
      };

      const existingIdx = state.accounts.findIndex((a) => a.studentPhone === studentPhone);
      if (existingIdx >= 0) {
        state.accounts[existingIdx] = newUser;
      } else {
        state.accounts.unshift(newUser);
      }

      // تفعيل كورس مناسب لصف الطالب تلقائياً كبداية ترحيبية
      const matchingCourse = ALL_COURSES.find((c) => c.grade === grade) || ALL_COURSES[0];
      if (matchingCourse && !state.enrolledCourseIds.includes(matchingCourse.id)) {
        state.enrolledCourseIds.push(matchingCourse.id);
      }
      if (matchingCourse) {
        state.activeCourseId = matchingCourse.id;
        state.activeLessonId = matchingCourse.lessons[0]?.id || '';
      }

      state.currentUser = newUser;
      state.modal = null;
      state.authError = '';
      state.view = 'dashboard';
      state.dashboardTab = 'lectures';
      persistState();
      render();
      showToast(`تم إنشاء حسابك بنجاح يا ${newUser.fullName}! مرحباً بك في بوابة الطالب.`);
    };

    window.handleLoginSubmit = function (event) {
      event.preventDefault();
      const form = event.target;
      const identifier = form.identifier.value.trim();
      const password = form.password.value.trim();

      if (!identifier || !password) {
        state.authError = 'يرجى إدخال رقم هاتف الطالب أو البريد الإلكتروني وكلمة المرور.';
        render();
        return;
      }

      const found = state.accounts.find(
        (acc) =>
          (acc.studentPhone === identifier ||
            (acc.email && acc.email.toLowerCase() === identifier.toLowerCase())) &&
          acc.password === password
      );

      if (!found) {
        state.authError = 'بيانات الدخول غير مطابقة. تأكد من رقم الهاتف وكلمة المرور أو أنشئ حساباً جديداً.';
        render();
        return;
      }

      state.currentUser = found;
      state.modal = null;
      state.authError = '';
      state.view = 'dashboard';
      state.dashboardTab = 'lectures';
      persistState();
      render();
      showToast(`أهلاً بعودتك يا ${found.fullName}!`);
    };

    window.triggerPdfPreview = function (pdfName) {

    window.selectExam = function (examId) {
      state.activeExamId = examId;
      state.examAnswers = {};
      state.lastExamSubmitted = false;
      render();
    };

    window.chooseExamOption = function (qId, optIdx) {
      if (state.lastExamSubmitted) return;
      state.examAnswers[qId] = optIdx;
      render();
    };

    window.submitCurrentExam = function () {
      const exam = EXAMS_DATA.find((e) => e.id === state.activeExamId) || EXAMS_DATA[0];
      let correct = 0;
      exam.questions.forEach((q) => {
        if (state.examAnswers[q.id] === q.correct) correct++;
      });
      const total = exam.questions.length;
      const percentage = Math.round((correct / total) * 100);
      const today = new Date().toISOString().slice(0, 10);

      state.results.unshift({
        id: 'res-' + Date.now(),
        examTitle: exam.title,
        date: today,
        score: correct,
        total,
        percentage,
        parentReported: true
      });

      state.lastExamSubmitted = true;
      persistState();
      render();
      showToast(`تم تسليم الاختبار (${correct}/${total} — ${percentage}%) وإرسال التقرير لرقم ولي الأمر!`);
    };

    window.openHomeworkModal = function (hwId) {
      state.modal = { type: 'homework', hwId };
      render();
    };

    window.submitHomework = function (event, hwId) {
      event.preventDefault();
      const form = event.target;
      const answerText = form.answerText.value.trim();
      const fileInput = form.fileName.value.trim();

      if (!answerText && !fileInput) {
        showToast('يرجى كتابة إجابة الواجب أو إدخال اسم ملف الحل قبل التسليم.', 'error');
        return;

      state.assignments = state.assignments.map((hw) => {
        if (hw.id !== hwId) return hw;
        return {
          ...hw,
          status: 'submitted',
          studentAnswer: [answerText, fileInput ? `ملف مرفق: ${fileInput}` : ''].filter(Boolean).join(' — ')
        };
      });

      state.modal = null;
      persistState();
      render();
      showToast('تم تسليم الواجب بنجاح! بانتظار مراجعة وتصحيح المستر.');
    };

            ${
              recommendedFirst.length === 0
                ? `<div class="bg-white rounded-3xl border border-slate-200 p-10 text-center text-sm font-bold text-emerald-700">أنت مشترك بالفعل في جميع الكورسات المتاحة على المنصة!</div>`
                : `
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                ${recommendedFirst
                  .map(
                    (c) => `
                  <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-xs flex flex-col justify-between">
                    <div>
                      <div class="bg-gradient-to-l ${c.accent} p-5 text-white">
                        <span class="text-[11px] font-extrabold bg-white/15 px-2.5 py-1 rounded-full">
                          ${c.grade === u.grade ? 'مناسب لصفك الدراسي ★' : escapeHtml(c.grade)}
                        </span>
                        <h4 class="text-lg font-black mt-2.5">${escapeHtml(c.title)}</h4>
                        <p class="text-xs text-white/80 mt-1">${escapeHtml(c.teacher)} • ${escapeHtml(c.hours)}</p>
                      </div>
                      <div class="p-5 space-y-3">
                        <p class="text-xs text-slate-600 leading-relaxed">${escapeHtml(c.desc)}</p>
                        <div class="flex items-center justify-between text-xs pt-2 border-t border-slate-100">
                          <span class="text-slate-500 font-bold">الاشتراك: <strong>${c.price} ج.م</strong></span>
                          <span class="font-mono text-indigo-700 font-bold">كود: ${escapeHtml(c.code)}</span>
                        </div>
                      </div>
                    </div>
                    <div class="p-5 pt-0">
                      <button type="button" onclick="enrollCourseDirect('${c.id}')" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black cursor-pointer">
                        اشترك في الكورس الآن
                      </button>
                    </div>
                  </div>
                `
                  )
                  .join('')}
              </div>
            `
            }
          </div>
        `;
      }

      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16 space-y-7">
          <!-- رأس ترحيبي يعرض الاسم الكامل والصف ورقم الطالب ورقم ولي الأمر -->
          <section class="glass-surface rounded-3xl border border-slate-200/90 p-6 sm:p-8 shadow-sm">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-5">
              <div class="space-y-2">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="text-xs font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-800">بوابة الطالب النشطة</span>
                  <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">${escapeHtml(u.grade)}</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-black text-slate-900">أهلاً بك، ${escapeHtml(u.fullName)}</h1>
                <div class="flex flex-wrap items-center gap-3 text-xs text-slate-600 pt-1">
                  <span class="px-3 py-1 rounded-xl bg-slate-100 font-bold">📱 هاتف الطالب: <strong dir="ltr">${escapeHtml(u.studentPhone)}</strong></span>
                  <span class="px-3 py-1 rounded-xl bg-amber-50 text-amber-900 border border-amber-200 font-bold">👨‍👩‍👦 رقم ولي الأمر: <strong dir="ltr">${escapeHtml(u.parentPhone)}</strong></span>
                  ${u.email ? `<span class="px-3 py-1 rounded-xl bg-slate-100 font-bold">✉️ ${escapeHtml(u.email)}</span>` : ''}
                </div>
              </div>

              <div class="flex flex-wrap items-center gap-2.5">
                <button type="button" onclick="openProfileModal()" class="px-4 py-2.5 rounded-xl bg-white hover:bg-slate-50 text-slate-800 border border-slate-200 text-xs font-extrabold cursor-pointer">
                  تعديل بياناتي
                </button>
                <button type="button" onclick="logoutStudent()" class="px-4 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-black cursor-pointer">
                  تسجيل الخروج
                </button>
              </div>
            </div>
          </section>

          <!-- شريط التنقل الداخلي للأقسام الخمسة -->
          <nav aria-label="أقسام بوابة الطالب" class="flex flex-wrap gap-2 bg-white p-2 rounded-2xl border border-slate-200 shadow-2xs">
            ${tabs
              .map(
                (t) => `
              <button type="button" onclick="setDashboardTab('${t.id}')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold flex items-center gap-2 transition-all cursor-pointer ${
                  state.dashboardTab === t.id
                    ? 'bg-indigo-600 text-white shadow-sm'
                    : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                }">
                <span>${t.label}</span>
                <span class="text-[11px] px-2 py-0.5 rounded-full ${
                  state.dashboardTab === t.id ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-700'
                }">${t.count}</span>
              </button>
            `
              )
              .join('')}
          </nav>

          <!-- محتوى التبويب النشط -->
          <div>${tabContentHtml}</div>
        </div>
      `;
    }

    function renderModals() {
      if (!state.modal) return '';

      // 1) مودال إنشاء حساب جديد / تسجيل الدخول
      if (state.modal.type === 'auth') {
        const isReg = state.modal.tab === 'register';
        return `
          <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
            <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 sm:p-8 my-8 space-y-5">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h2 class="text-xl sm:text-2xl font-black text-slate-900">${isReg ? 'إنشاء حساب طالب جديد' : 'تسجيل الدخول'}</h2>
                  <p class="text-xs text-slate-500 mt-1">
                    ${isReg ? 'أدخل بياناتك بدقة لربط حسابك وتقارير المتابعة مع ولي الأمر.' : 'ادخل برقم هاتفك أو بريدك الإلكتروني لفتح لوحة الطالب.'}
                  </p>
                </div>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 cursor-pointer">✕</button>
              </div>

              <!-- تبويبات التبديل -->
              <div class="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-2xl">
                <button type="button" onclick="switchAuthTab('register')" class="py-2.5 rounded-xl text-xs sm:text-sm font-black transition-all cursor-pointer ${
                  isReg ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600'
                }">
                  إنشاء حساب جديد
                </button>
                <button type="button" onclick="switchAuthTab('login')" class="py-2.5 rounded-xl text-xs sm:text-sm font-black transition-all cursor-pointer ${
                  !isReg ? 'bg-white text-indigo-700 shadow-xs' : 'text-slate-600'
                }">
                  تسجيل الدخول
                </button>
              </div>

              ${
                state.authError
                  ? `<div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold">${escapeHtml(state.authError)}</div>`
                  : ''
              }

              ${
                isReg
                  ? `
                <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-3.5">
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1">الاسم بالكامل <span class="text-rose-500">*</span></label>
                    <input type="text" name="fullName" required placeholder="مثال: أحمد محمد محمود" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 mb-1">رقم هاتف الطالب <span class="text-rose-500">*</span></label>
                      <input type="tel" name="studentPhone" required placeholder="01012345678" dir="ltr" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    </div>
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 mb-1">رقم ولي الأمر <span class="text-rose-500">*</span></label>
                      <input type="tel" name="parentPhone" required placeholder="01198765432" dir="ltr" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    </div>
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 mb-1">البريد الإلكتروني <span class="text-slate-400 font-semibold">(اختياري)</span></label>
                      <input type="email" name="email" placeholder="student@example.com" dir="ltr" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-right focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    </div>
                    <div>
                      <label class="block text-xs font-extrabold text-slate-700 mb-1">كلمة المرور <span class="text-rose-500">*</span></label>
                      <input type="password" name="password" required placeholder="••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1">الصف الدراسي <span class="text-rose-500">*</span></label>
                    <select name="grade" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white font-bold">
                      <option value="الصف الثالث الثانوي - ثانوية عامة">الصف الثالث الثانوي - ثانوية عامة</option>
                      <option value="الصف الثاني الثانوي">الصف الثاني الثانوي</option>
                      <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
                    </select>
                  </div>

                  <div class="pt-2">
                    <button type="submit" class="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-black shadow-md cursor-pointer">
                      إنشاء الحساب والدخول للمنصة
                    </button>
                  </div>
                </form>
              `
                  : `
                <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1">رقم هاتف الطالب أو البريد الإلكتروني</label>
                    <input type="text" name="identifier" required placeholder="أدخل رقم هاتفك أو بريدك الإلكتروني" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>

                  <div>
                    <label class="block text-xs font-extrabold text-slate-700 mb-1">كلمة المرور</label>
                    <input type="password" name="password" required placeholder="••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" />
                  </div>

                  <button type="submit" class="w-full py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-black shadow-md cursor-pointer">
                    تسجيل الدخول
                  </button>
                </form>
              `
              }
            </div>
          </div>
        `;
      }

      // 2) مودال معاينة الكتاب
      if (state.modal.type === 'book') {
        const book = ALL_BOOKS.find((b) => b.id === state.modal.bookId);
        if (!book) return '';
        const ordered = state.orderedBookIds.includes(book.id);
        return `
          <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-lg w-full overflow-hidden">
              <div class="bg-gradient-to-br ${book.tone} p-6 text-white flex items-start justify-between">
                <div>
                  <span class="text-xs font-bold bg-white/15 px-3 py-1 rounded-full">${escapeHtml(book.format)}</span>
                  <h3 class="text-xl font-black mt-2">${escapeHtml(book.title)}</h3>
                </div>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-white/15 text-white cursor-pointer">✕</button>
              </div>
              <div class="p-6 space-y-4">
                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${escapeHtml(book.desc)}</p>
                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 text-xs sm:text-sm text-slate-700">
                  <strong class="block text-slate-900 mb-1">عينة من المحتوى:</strong>
                  <span>${escapeHtml(book.sample)}</span>
                </div>
                <div class="flex items-center justify-end gap-2 pt-2">
                  <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-extrabold cursor-pointer">إغلاق</button>
                  <button type="button" onclick="orderBook('${book.id}')" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black cursor-pointer">
                    ${ordered ? 'تم حجز الكتاب ✓' : `حجز الكتاب (${book.price} ج.م)`}
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 3) مودال تسليم الواجب
      if (state.modal.type === 'homework') {
        const hw = state.assignments.find((h) => h.id === state.modal.hwId);
        if (!hw) return '';
        return `
          <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 sm:p-7 space-y-4">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-xs font-extrabold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full">تسليم الواجب</span>
                  <h3 class="text-lg font-black text-slate-900 mt-2">${escapeHtml(hw.title)}</h3>
                </div>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 text-slate-600 cursor-pointer">✕</button>
              </div>

              <form onsubmit="submitHomework(event, '${hw.id}')" class="space-y-4">
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 mb-1">اكتب إجابتك أو ملاحظات الحل</label>
                  <textarea name="answerText" rows="4" placeholder="اكتب خطوات الحل أو الإجابات النهائية هنا..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm">${escapeHtml(hw.studentAnswer || '')}</textarea>
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 mb-1">اسم ملف الحل المرفق (اختياري)</label>
                  <input type="text" name="fileName" placeholder="مثال: واجب_المقاومات.pdf" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" />
                </div>
                <div class="flex justify-end gap-2">
                  <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-extrabold cursor-pointer">إلغاء</button>
                  <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black cursor-pointer">إرسال الواجب</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      // 4) مودال عرض وتعديل ملف الطالب ورقم ولي الأمر
      if (state.modal.type === 'profile' && state.currentUser) {
        const u = state.currentUser;
        return `
          <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-md w-full p-6 sm:p-7 space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-lg font-black text-slate-900">بيانات الطالب وولي الأمر</h3>
                <button type="button" onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 text-slate-600 cursor-pointer">✕</button>
              </div>
              <form onsubmit="saveProfileChanges(event)" class="space-y-3.5">
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 mb-1">الاسم بالكامل</label>
                  <input type="text" name="fullName" value="${escapeHtml(u.fullName)}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 mb-1">رقم هاتف الطالب</label>
                  <input type="tel" name="studentPhone" value="${escapeHtml(u.studentPhone)}" required dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm text-right" />
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 mb-1">رقم ولي الأمر</label>
                  <input type="tel" name="parentPhone" value="${escapeHtml(u.parentPhone)}" required dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm text-right" />
                </div>
                <div>
                  <label class="block text-xs font-extrabold text-slate-700 mb-1">البريد الإلكتروني (اختياري)</label>
                  <input type="email" name="email" value="${escapeHtml(u.email || '')}" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm text-right" />
                </div>
                <div class="flex justify-end gap-2 pt-2">
                  <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-xs font-extrabold cursor-pointer">إلغاء</button>
                  <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-black cursor-pointer">حفظ التعديلات</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      return '';
    }

    function render() {
      const root = document.getElementById('app');
      if (!root) return;

      const toastHtml = state.toast
        ? `
          <div class="fixed bottom-5 left-5 z-50 max-w-sm bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-2.5 text-xs sm:text-sm font-bold">
            <span class="w-2.5 h-2.5 rounded-full shrink-0 ${
              state.toast.tone === 'error' ? 'bg-rose-400' : state.toast.tone === 'info' ? 'bg-sky-400' : 'bg-emerald-400'
            }"></span>
            <span>${escapeHtml(state.toast.text)}</span>
          </div>
        `
        : '';

      root.innerHTML = `
        ${renderHeader()}
        <main class="flex-1">
          ${state.view === 'dashboard' && state.currentUser ? renderStudentDashboard() : renderLandingPage()}
        </main>
        <footer class="glass-surface border-t border-slate-200/80 py-6 px-4 text-xs text-slate-500">
          <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <p class="font-bold text-slate-700">منصة المستر التعليمية — بوابة الطالب المتكاملة.</p>
            <p>تُحفظ بيانات الحساب والمحاضرات والنتائج والواجبات تلقائياً في المتصفح.</p>
          </div>
        </footer>
        ${renderModals()}
        ${toastHtml}
      `;
    }

    // التشغيل الأولي عند تحميل الصفحة
    render();
  </script>
</body>
</html>
